#
# Copy to docker-compose.yml (gitignored), copy .env.example to .env, fill it in,
# then: docker compose up -d
#
# LAN access: http://<server-lan-ip>:8080/#token=<one of DASHBOARD_TOKENS>
# Tailnet HTTPS instead: see deploy/tailscale/ (adds a Tailscale sidecar).

services:
  dashboard:
    image: ghcr.io/snoopysneeze335/desk-dashboard:latest
    # build: .            # or build locally from this checkout
    container_name: desk-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      # Quota counter + holdings cache; must survive restarts. A named volume
      # gets the right owner automatically. For a host folder instead, first
      # run: mkdir -p ./data && sudo chown 10001:10001 ./data
      - dashboard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  dashboard-data:
