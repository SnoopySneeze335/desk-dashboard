; SPDX-License-Identifier: GPL-3.0-or-later
;
; Desk Dashboard firmware for the ESP32-2432S028R ("Cheap Yellow Display").
;
;   pio run -e cyd            ILI9341 panel (most boards)
;   pio run -e cyd-st7789     ST7789 panel revision (often needs color inversion)
;   pio run -e cyd-demo       synthetic data, no network
;   pio run -e cyd -t upload  flash over USB
;
; Display options (any env, via build_flags):
;   -DDISPLAY_ST7789          use the ST7789 driver instead of ILI9341
;   -DDISPLAY_INVERT=1        invert colors (if black shows as white)
;   -DDISPLAY_ROTATION=1      0-3; 1 = landscape with USB on the right
;   -DLIGHT_SENSOR_INVERTED=1 if the screen gets brighter in the dark
;
; Libraries are pinned to GitHub tags (licenses: LovyanGFX BSD-2-Clause,
; ArduinoJson MIT, WiFiManager MIT). The platform is pioarduino (Arduino core
; 3.x), which ships the ESP-IDF default CA bundle used for HTTPS validation.

[platformio]
default_envs = cyd

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.36
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
    https://github.com/tzapu/WiFiManager.git#v2.0.17
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"1.0.0\"

[env:cyd]

[env:cyd-st7789]
build_flags =
    ${env.build_flags}
    -DDISPLAY_ST7789
    -DDISPLAY_INVERT=1

[env:cyd-demo]
build_flags =
    ${env.build_flags}
    -DDEMO
