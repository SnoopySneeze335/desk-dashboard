# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  web:
    name: Web lint, format and type check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  docker:
    name: Docker build (amd64 + arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test demo mode
        run: |
          docker build -t desk-dashboard:ci .
          docker run -d --name dd --read-only -e DEMO_MODE=true -e DASHBOARD_TOKENS=ci-token -p 8080:8080 desk-dashboard:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/dashboard)" = 401
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:8080/v1/dashboard | python3 -m json.tool
          docker images desk-dashboard:ci
          docker rm -f dd

  firmware:
    name: Firmware compile (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [cyd, cyd-demo, cyd-st7789]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/cache@v4.2.3
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.1.18 clang-format==20.1.5
      - name: clang-format check
        run: clang-format --dry-run --Werror firmware/src/*.cpp firmware/include/*.h
      - run: pio run -d firmware -e ${{ matrix.env }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose
