# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "desk-dashboard"
version = "1.0.0"
description = "Self-hosted at-a-glance dashboard backend"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["desk_dashboard"]

[[tool.mypy.overrides]]
module = ["aioresponses.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Any attempt to open a real network connection fails the test.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
